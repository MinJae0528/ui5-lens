<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3268b2"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="55" font-family="Malgun Gothic,Arial,sans-serif" font-size="36" fill="#12253f" font-weight="700">UI5 Lens MVC 역할 설계</text><text x="40" y="95" font-family="Malgun Gothic,Arial,sans-serif" font-size="22" fill="#52647e" font-weight="400">현재 React 작업본 기준  |  실선: 주요 흐름  ·  점선: View의 직접 자료 로딩</text><rect x="40" y="155" width="450" height="390" rx="16" fill="#edf4ff" stroke="#d5deeb" stroke-width="2"/><rect x="575" y="155" width="450" height="390" rx="16" fill="#eef8f5" stroke="#d5deeb" stroke-width="2"/><rect x="1110" y="155" width="450" height="390" rx="16" fill="#fff6e8" stroke="#d5deeb" stroke-width="2"/><text x="65" y="201" font-family="Malgun Gothic,Arial,sans-serif" font-size="30" fill="#1c559b" font-weight="700">VIEW  화면</text><text x="65" y="248" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">App.tsx · shell/*</text><text x="65" y="287" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">detail/* · Ask.tsx · ui.tsx</text><text x="65" y="326" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">검색창과 동명 API 후보</text><text x="65" y="365" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">상세 탭과 한국어 상태</text><text x="65" y="404" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">버전 · 출처 · 예제 표시</text><text x="600" y="201" font-family="Malgun Gothic,Arial,sans-serif" font-size="27" fill="#246952" font-weight="700">CONTROLLER  동작과 상태</text><text x="600" y="248" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">useSearchController</text><text x="600" y="287" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">useRoute · routeState</text><text x="600" y="326" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">useRec · useMemberRows</text><text x="600" y="365" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">useMemberRec</text><text x="600" y="404" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">입력 · 선택 · 복귀 · 로딩 조율</text><text x="1135" y="201" font-family="Malgun Gothic,Arial,sans-serif" font-size="29" fill="#95601a" font-weight="700">MODEL  자료와 도메인</text><text x="1135" y="248" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">types.ts  자료 규약</text><text x="1135" y="287" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">data.ts  로딩과 캐시</text><text x="1135" y="326" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">domain/*  순수 계산</text><text x="1135" y="365" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">검색 · 추천 · 상속 병합</text><text x="1135" y="404" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">버전과 검토 상태 판정</text><path d="M490 290 H560" fill="none" stroke="#3268b2" stroke-width="4"  marker-end="url(#arr)"/><text x="497" y="264" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" fill="#12253f" font-weight="400">동작</text><path d="M575 425 H505" fill="none" stroke="#3268b2" stroke-width="4"  marker-end="url(#arr)"/><text x="500" y="466" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" fill="#12253f" font-weight="400">상태</text><path d="M1025 290 H1095" fill="none" stroke="#3268b2" stroke-width="4"  marker-end="url(#arr)"/><text x="1033" y="264" font-family="Malgun Gothic,Arial,sans-serif" 