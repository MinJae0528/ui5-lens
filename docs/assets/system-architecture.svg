<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3268b2"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="55" font-family="Malgun Gothic,Arial,sans-serif" font-size="36" fill="#12253f" font-weight="700">UI5 Lens 시스템 아키텍처</text><text x="40" y="95" font-family="Malgun Gothic,Arial,sans-serif" font-size="22" fill="#52647e" font-weight="400">현재 구현  |  수집과 정규화는 개발 단계에서 수행  ·  사용 시에는 정적 자료 조회</text><rect x="30" y="130" width="1540" height="340" rx="16" fill="#f6f8fc" stroke="#d5deeb" stroke-width="2"/><text x="55" y="175" font-family="Malgun Gothic,Arial,sans-serif" font-size="26" fill="#12253f" font-weight="700">1  개발 및 데이터 준비</text><rect x="60" y="215" width="330" height="175" rx="16" fill="#edf4ff" stroke="#d5deeb" stroke-width="2"/><text x="82" y="256" font-family="Malgun Gothic,Arial,sans-serif" font-size="24" fill="#12253f" font-weight="400">SAP 공식 자료</text><text x="82" y="298" font-family="Malgun Gothic,Arial,sans-serif" font-size="24" fill="#12253f" font-weight="400">버전 목록 · api.json</text><text x="82" y="340" font-family="Malgun Gothic,Arial,sans-serif" font-size="24" fill="#12253f" font-weight="400">문서 목차 index.json</text><rect x="480" y="215" width="440" height="175" rx="16" fill="#eef8f5" stroke="#d5deeb" stroke-width="2"/><text x="502" y="256" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">Node 수집 및 빌드 스크립트</text><text x="502" y="298" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">원본 캐시 → 정규화와 검증</text><text x="502" y="340" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">한국어 JSON · 별칭 · 용어 사전</text><rect x="1010" y="215" width="500" height="175" rx="16" fill="#fff6e8" stroke="#d5deeb" stroke-width="2"/><text x="1032" y="256" font-family="Malgun Gothic,Arial,sans-serif" font-size="24" fill="#12253f" font-weight="400">Vite 빌드 결과</text><text x="1032" y="298" font-family="Malgun Gothic,Arial,sans-serif" font-size="24" fill="#12253f" font-weight="400">HTML · JS · CSS</text><text x="1032" y="340" font-family="Malgun Gothic,Arial,sans-serif" font-size="24" fill="#12253f" font-weight="400">버전별 JSON / gzip · 한국어 설명</text><path d="M390 300 H465" fill="none" stroke="#3268b2" stroke-width="4"  marker-end="url(#arr)"/><path d="M920 300 H995" fill="none" stroke="#3268b2" stroke-width="4"  marker-end="url(#arr)"/><text x="60" y="435" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#52647e" font-weight="400">실제 자료: 31개 버전 / 한국어 상세 2개 / 문서 목차 29개 버전  ·  2026-11-05 로컬 생성 자료 기준</text><rect x="30" y="520" width="1540" height="475" rx="16" fill="#f6f8fc" stroke="#d5deeb" stroke-width="2"/><text x="55" y="565" font-family="Malgun Gothic,Arial,sans-serif" font-size="26" fill="#12253f" font-weight="700">2  브라우저 실행</text><rect x="60" y="625" width="330" height="235" rx="16" fill="#fff6e8" stroke="#d5deeb" stroke-width="2"/><text x="82" y="673" font-family="Malgun Gothic,Arial,sans-serif" font-size="22" fill="#12253f" font-weight="400">정적 파일 호스트</text><text x="82" y="719" font-family="Malgun Gothic,Arial,sans-serif" font-size="22" fill="#12253f" font-weight="400">로컬 서버 또는 배포 호스트</text><text x="82" y="765" font-family="Malgun Gothic,Arial,sans-serif" font-size="22" fill="#12253f" font-weight="400">정적 파일만 응답</text><text x="82" y="811" font-family="Malgun Gothic,Arial,sans-serif" font-size="22" fill="#12253f" font-weight="400">비즈니스 API · DB 없음</text><rect x="480" y="625" width="560" height="235" rx="16" fill="#edf4ff" stroke="#d5deeb" stroke-width="2"/><text x="502" y="673" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">사용자 브라우저  React 앱</text><text x="502" y="719" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#12253f" font-weight="400">검