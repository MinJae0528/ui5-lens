end="url(#arr)"/><text x="60" y="927" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" fill="#1c559b" font-weight="700">검색 시 외부 AI 호출 없음</text><text x="60" y="965" font-family="Malgun Gothic,Arial,sans-serif" font-size="22" fill="#52647e" font-weight="400">공식 문서 본문은 링크를 열어 외부 사이트에서 확인</text><text x="40" y="1045" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#52647e" font-weight="400">정적 호스트의 외부 배포 완료 여부는 미확인. 예제 실행에만 UI5 CDN 네트워크 연결이 필요하다.</text></svg>